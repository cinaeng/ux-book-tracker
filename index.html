  .pg-row { display: flex; gap: 24px; flex-wrap: wrap; }
  .pg-cell { flex: 1; min-width: 130px; }
  .pg-lbl { font-size: 11.5px; color: #888; font-weight: 600; }
  .pg-val { font-size: 27px; font-weight: 700; letter-spacing: -1px; line-height: 1.1; margin-top: 3px; }
  .pg-val span { font-size: 13px; font-weight: 600; color: #888; margin-left: 2px; }
  .pg-note { font-size: 11px; color: #999; margin-top: 4px; line-height: 1.4; }
  .pg-bar { position: relative; height: 9px; background: #f0f0ee; border-radius: 5px; margin: 14px 0 8px; }
  .pg-fill { position: absolute; left: 0; top: 0; height: 100%; border-radius: 5px; transition: width .2s; z-index: 1; }
  .pg-band { position: absolute; top: -2px; height: 13px; border-left: 2px solid #0a7f3f; border-right: 2px solid #0a7f3f; background: rgba(10,127,63,.10); z-index: 2; }
  .pg-cap { font-size: 10.5px; color: #aaa; line-height: 1.5; }

  /* 구매 이력 사람별 필터 탭 */
  .pfilter { display: flex; gap: 7px; margin: 0 0 11px; }
  .pfilter button { font-family: inherit; cursor: pointer; font-size: 12.5px; font-weight: 600; padding: 6px 15px; border: 1px solid #ddd; border-radius: 999px; background: #fff; color: #888; transition: .12s; }
  .pfilter button:hover { border-color: #bbb; color: #444; }
  .pfilter button.on { background: #111; border-color: #111; color: #fff; }
  .pnote-btn { display: inline-block; margin-top: 9px; font-size: 12px; font-weight: 600; padding: 7px 15px; border-radius: 999px; background: #0a7f3f; color: #fff; text-decoration: none; }
  .pnote-btn:hover { background: #08682f; }
</style>
</head>
<body>
<div id="root"><div class="loading">순위 데이터를 불러오는 중…</div></div>

<script>
const BOOK = {
  title: "UX의 언어들",
  subtitle: "마음과 행동을 움직이는 설계의 원리 · 한성희, 신행철 · 파지트",
  pubdate: "2026-07-07"
};

const U = {
  y_product: "https://www.yes24.com/product/goods/193444437",
  y_mkt:     "https://www.yes24.com/product/category/bestseller?categoryNumber=001001025009&pageNumber=1&pageSize=100",
  y_econ:    "https://www.yes24.com/product/category/bestseller?categoryNumber=001001025&pageNumber=1&pageSize=100",
  y_web:     "https://www.yes24.com/product/category/bestseller?categoryNumber=001001003020&pageNumber=1&pageSize=100",
  y_uxui:    "https://www.yes24.com/product/category/bestseller?categoryNumber=001001003020004&pageNumber=1&pageSize=100",
  y_ad:      "https://www.yes24.com/product/category/bestseller?categoryNumber=001001025009006&pageNumber=1&pageSize=100",
  y_design:  "https://www.yes24.com/product/category/bestseller?categoryNumber=001001007003004&pageNumber=1&pageSize=100",
  refresh:   "https://github.com/cinaeng/ux-book-tracker/actions/workflows/collect.yml",
  k_product: "https://product.kyobobook.co.kr/detail/S000220493173",
  k_econ_w:  "https://store.kyobobook.co.kr/bestseller/online/weekly/domestic/13",
  k_econ_d:  "https://store.kyobobook.co.kr/bestseller/online/daily/domestic/13",
  k_it_d:    "https://store.kyobobook.co.kr/bestseller/online/daily/domestic/33",
  k_website: "https://store.kyobobook.co.kr/category/domestic/3319/best",
  k_uxui:    "https://store.kyobobook.co.kr/category/domestic/331902/best",
  k_tot_eco: "https://store.kyobobook.co.kr/bestseller/total/weekly/economics",
  k_tot_tec: "https://store.kyobobook.co.kr/bestseller/total/weekly/tech",
  a_product: "https://www.aladin.co.kr/shop/wproduct.aspx?ItemId=397807838",
  a_best_ad: "https://www.aladin.co.kr/shop/common/wbest.aspx?BranchType=1&CID=268&BestType=Bestseller&cnt=100&SortOrder=1&page=1",
  a_best_design: "https://www.aladin.co.kr/shop/common/wbest.aspx?BranchType=1&CID=51089&BestType=Bestseller&cnt=100&SortOrder=1&page=1",
  a_best_brand: "https://www.aladin.co.kr/shop/common/wbest.aspx?BranchType=1&CID=1632&BestType=Bestseller&cnt=100&SortOrder=1&page=1",
  a_best_econ: "https://www.aladin.co.kr/shop/common/wbest.aspx?BranchType=1&CID=170&BestType=Bestseller&cnt=100&SortOrder=1&page=1",
  a_best_mkt: "https://www.aladin.co.kr/shop/common/wbest.aspx?BranchType=1&CID=261&BestType=Bestseller&cnt=100&SortOrder=1&page=1",
  a_best_designcraft: "https://www.aladin.co.kr/shop/common/wbest.aspx?BranchType=1&CID=50972&BestType=Bestseller&cnt=100&SortOrder=1&page=1"
};

const nf = n => n == null ? "—" : n.toLocaleString("ko-KR");
const fmtTs = ts => {
  const d = new Date(ts), p = n => String(n).padStart(2, "0");
  return `${p(d.getMonth() + 1)}/${p(d.getDate())}`;
};
const fmtFull = ts => {
  const d = new Date(ts), p = n => String(n).padStart(2, "0");
  return `${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const deltaHtml = (c, p, lowerBetter) => {
  if (c == null || p == null || c === p) return "";
  const diff = c - p, improved = lowerBetter ? diff < 0 : diff > 0;
  return `<span class="delta ${improved ? "up" : "down"}">${improved ? "▲" : "▼"}${nf(Math.abs(diff))}</span>`;
};
const cell = v => v == null ? `<span class="na">권외</span>` : nf(v);

function rankStats(H, get) {
  const s = H.map(get);
  const vals = s.filter(v => v != null);
  const best = vals.length ? Math.min(...vals) : null;
  const last = s[s.length - 1];
  let streak = 0;
  if (last != null) for (let i = s.length - 1; i >= 0 && s[i] === last; i--) streak++;
  return { best, streak, cur: last };
}

function rankCard(val, prevVal, label, sub, color, hero, href, rec) {
  const body = val != null
    ? `<div class="val">${nf(val)}<small>위</small>${deltaHtml(val, prevVal, true)}</div>`
    : `<div class="val out">순위권 밖</div>`;
  let recHtml = "";
  if (rec) {
    const b = [];
    if (rec.best != null) b.push(`<span style="color:#b26a00;font-weight:700;background:#fff5e6;border:1px solid #f0d9b0;border-radius:5px;padding:1px 6px;">최고 ${nf(rec.best)}위</span>`);
    if (rec.cur != null && rec.streak > 1) b.push(`<span style="color:#0a7f3f;font-weight:700;background:#ecf8f0;border:1px solid #bfe6cd;border-radius:5px;padding:1px 6px;">${rec.streak}일 연속</span>`);
    if (b.length) recHtml = `<div style="font-size:10.5px;margin-top:6px;display:flex;flex-wrap:wrap;gap:5px;">${b.join("")}</div>`;
  }
  const inner = `<div class="lbl"><span class="dot" style="background:${color}"></span>${label}</div>
    ${body}<div class="sub2">${sub}</div>${recHtml}`;
  const cls = `card${hero ? " hero" : ""}`;
  return href
    ? `<a class="${cls}" href="${href}" target="_blank" rel="noopener">${inner}</a>`
    : `<div class="${cls}">${inner}</div>`;
}

let charts = [];
function resetCharts() {
  charts.forEach(c => c.destroy());
  charts = [];
}

function render(H) {
  resetCharts();
  const cur = H[H.length - 1];
  const _cy = cur.yes24 || {};
  LATEST_ECON = _cy.econ_rank != null ? _cy.econ_rank : null;
  LATEST_UXUI = _cy.uxui_rank != null ? _cy.uxui_rank : null;
  LATEST_WEB = _cy.web_rank != null ? _cy.web_rank : null;
  LATEST_DESIGN = _cy.design_rank != null ? _cy.design_rank : null;
  LATEST_MKT = _cy.mkt_rank != null ? _cy.mkt_rank : null;
  LATEST_REVIEWS = _cy.reviews != null ? _cy.reviews : null;
  // 7일 전(가장 가까운 시점)의 리뷰 수 — 리뷰 유입 속도 계산용
  {
    const goal = new Date(cur.ts).getTime() - 7 * 864e5;
    let best = null, bestDiff = Infinity;
    for (const h of H) {
      if (!h.yes24 || h.yes24.reviews == null) continue;
      const d = Math.abs(new Date(h.ts).getTime() - goal);
      if (d < bestDiff) { bestDiff = d; best = h.yes24.reviews; }
    }
    REVIEWS_7AGO = best;
  }
  // 마케팅/세일즈 50위 내 연속 유지 일수 (최신부터 거꾸로 세다가 50위 밖이면 중단)
  {
    let streak = 0;
    for (let i = H.length - 1; i >= 0; i--) {
      const m = H[i].yes24 && H[i].yes24.mkt_rank;
      if (m != null && m <= 50) streak++;
      else break;
    }
    MKT_TOP50_STREAK = streak;
  }
  // 날짜별 순위 맵 (구매→순위 반응 분석용)
  RANK_BY_DATE = {};
  for (const h of H) {
    const d = (h.ts || "").slice(0, 10);
    if (!d) continue;
    const yy = h.yes24 || {};
    RANK_BY_DATE[d] = { mkt: yy.mkt_rank ?? null, econ: yy.econ_rank ?? null, si: yy.sales_index ?? null };
  }
  const pre = H.length > 1 ? H[H.length - 2] : {};
  const days = Math.floor((new Date(cur.ts) - new Date(BOOK.pubdate + "T00:00:00+09:00")) / 864e5);
  const labels = H.map(h => fmtTs(h.ts));
  const y = cur.yes24 || {}, py = pre.yes24 || {};
  const a = cur.aladin || {}, pa = pre.aladin || {};
  const ko = cur.kyobo_online || {}, pko = pre.kyobo_online || {};
  const kt = cur.kyobo_total || {}, pkt = pre.kyobo_total || {};
  const km = cur.kyobo_meta || {}, pkm = pre.kyobo_meta || {};

  document.getElementById("root").innerHTML = `
<div class="hdr">
  <div class="hdr-row">
    <div>
      <h1>${BOOK.title} — 서점 순위 트래커</h1>
      <p class="sub">${BOOK.subtitle}</p>
      <p class="meta">최종 수집 ${fmtTs(cur.ts)} · 출간 ${days}일차 · 매일 새벽 4시(KST) 예스24·교보문고 자동 갱신</p>
    </div>
    <div class="hdr-actions">
      <button class="refresh" id="btnRefresh" title="최신 수집 결과를 다시 불러옵니다. 수집 자체는 매일 새벽 4시에 자동 실행됩니다.">

let PBASE = [];
const P_LS_ADD = "uxbt_purchases_add";
const P_LS_DEL = "uxbt_purchases_del";
const P_LS_EDIT = "uxbt_purchases_edit"; // { id: {date,arrival,store,buyer,qty,amount} } 편집 오버라이드(원본 데이터 수정용)
const pLoadLS = k => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch (e) { return []; } };
const pSaveLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const pLoadObj = k => { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch (e) { return {}; } };
let pChart = null;
let LATEST_ECON = null; // 최신 예스24 경제경영 종합 순위 (참고용)
// 세부 카테고리 방어 + 리뷰 추적용 (가이드가 실제로 쓰는 값)
let LATEST_UXUI = null, LATEST_WEB = null, LATEST_DESIGN = null, LATEST_MKT = null;
let LATEST_REVIEWS = null, REVIEWS_7AGO = null;
let MKT_TOP50_STREAK = 0; // 마케팅/세일즈가 50위 내를 유지한 연속 수집일수
let RANK_BY_DATE = {}; // { "2026-08-01": {mkt, econ, si} } — 구매→순위 반응 분석용
let P_TABLE_FILTER = "전체"; // 구매 이력 리스트 사람별 필터: 전체 / 한성희 / 신행철

// 항상 표시할 구매자(데이터 없어도 0권으로 노출) + 색상
const KNOWN_BUYERS = ["한성희", "신행철"];
const BUYER_COLORS = { "한성희": "#c0392b", "신행철": "#1a5fb4" };
const BUYER_PALETTE = ["#8e44ad", "#e67e22", "#16a085", "#d68910", "#2980b9"];
function buyerColor(b) {
  if (BUYER_COLORS[b]) return BUYER_COLORS[b];
  let h = 0; for (const c of b) h = (h + c.charCodeAt(0)) % BUYER_PALETTE.length;
  return BUYER_PALETTE[h];
}
function buyerList(rows) {
  const found = [];
  rows.forEach(r => { const b = r.buyer || "미지정"; if (!found.includes(b)) found.push(b); });
  return [...KNOWN_BUYERS, ...found.filter(b => !KNOWN_BUYERS.includes(b))];
}

function pAll() {
  const add = pLoadLS(P_LS_ADD);
  const del = new Set(pLoadLS(P_LS_DEL));
  const edits = pLoadObj(P_LS_EDIT);
  return [...PBASE, ...SHEET_ROWS, ...add]
    .filter(r => r && !del.has(r.id))
    .map(r => edits[r.id] ? Object.assign({}, r, edits[r.id]) : r)
    .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
}
function pMetric(label, val, color) {
  return `<div class="card"><div class="lbl"><span class="dot" style="background:${color}"></span>${label}</div><div class="val">${val}</div></div>`;
}
function pAdd(rec) { const a = pLoadLS(P_LS_ADD); a.push(rec); pSaveLS(P_LS_ADD, a); refreshPurchase(); }
// 폼 입력을 구글시트에 저장(공유). SHEET_WRITE_URL이 없으면 이 브라우저에만 저장(pAdd)으로 폴백.
async function pAddShared(rec) {
  if (!SHEET_WRITE_URL) { pAdd(rec); return; }
  const body = JSON.stringify({
    date: toMD(rec.date), arrival: rec.arrival ? toMD(rec.arrival) : "",
    store: rec.store, qty: rec.qty, memo: "",
    buyer: SHEET_KNOWN_BUYERS.includes(rec.buyer) ? rec.buyer : ""  // 알려진 이름만, 아니면 비워 한성희 처리
  });
  try {
    // no-cors: 응답은 못 읽지만 시트에는 정상 추가된다(프리플라이트 회피).
    await fetch(SHEET_WRITE_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body });
    // 낙관적 반영: 시트 게시(CSV) 갱신 전까지 화면에 바로 보이도록 임시 추가.
    SHEET_ROWS.push({ id: "pending_" + Date.now(), date: rec.date, arrival: rec.arrival || null, store: rec.store, buyer: SHEET_KNOWN_BUYERS.includes(rec.buyer) ? rec.buyer : SHEET_BUYER, qty: rec.qty, amount: (+rec.qty || 0) * 15300 });
    refreshPurchase();
    alert("구글시트에 저장했어요. 두 사람 모두 보이게 됩니다.\n(시트 게시 갱신까지 몇 분 걸릴 수 있어요. 새로고침 시 정식 반영)");
  } catch (e) {
    pAdd(rec);
    alert("시트 저장에 실패해 이 브라우저에만 저장했습니다. 잠시 후 다시 시도해 주세요.");
  }
}
function pDelete(id) {
  let a = pLoadLS(P_LS_ADD);
  if (a.some(r => r.id === id)) { a = a.filter(r => r.id !== id); pSaveLS(P_LS_ADD, a); }
  else { const d = pLoadLS(P_LS_DEL); if (!d.includes(id)) { d.push(id); pSaveLS(P_LS_DEL, d); } }
  refreshPurchase();
}
// 편집 저장: 직접입력분은 그 자리서 수정, 원본 데이터는 오버라이드로 저장(이 브라우저 한정)
function pApplyEdit(id, rec) {
  const add = pLoadLS(P_LS_ADD);
  const i = add.findIndex(r => r.id === id);
  if (i >= 0) { add[i] = Object.assign({}, add[i], rec); pSaveLS(P_LS_ADD, add); }
  else { const e = pLoadObj(P_LS_EDIT); e[id] = rec; pSaveLS(P_LS_EDIT, e); }
  refreshPurchase();
}
let P_EDIT_ID = null;
function openEditModal(id) {
  const rec = pAll().find(r => r.id === id);
  if (!rec) return;

  const src = document.getElementById("pe-source");
  if (src) src.textContent = (pLoadLS(P_LS_ADD).some(r => r.id === id))
    ? "직접 입력한 기록 — 이 브라우저에 저장됩니다."
    : "원본 데이터 기록 — 이 브라우저에만 반영됩니다(모든 기기 반영은 채팅으로 요청).";
  const m = document.getElementById("p-modal");
  if (m) m.hidden = false;
}
function closeEditModal() {
  P_EDIT_ID = null;
  const m = document.getElementById("p-modal");
  if (m) m.hidden = true;
}
function saveEditModal() {
  if (!P_EDIT_ID) return;
  const date = document.getElementById("pe-date").value;
  const arrival = document.getElementById("pe-arrival").value || null;
  const store = document.getElementById("pe-store").value;
  const buyer = document.getElementById("pe-buyer").value.trim() || null;
  const qty = parseInt(document.getElementById("pe-qty").value, 10);
  const ar = document.getElementById("pe-amount").value;
  const amount = ar ? parseInt(ar, 10) : null;
  if (!date) { alert("주문일을 입력하세요."); return; }
  if (!qty || qty < 1) { alert("수량을 1 이상 입력하세요."); return; }
  pApplyEdit(P_EDIT_ID, { date, arrival, store, buyer, qty, amount });
  closeEditModal();
}
function refreshPurchase() {
  const rows = pAll();
  const q = rows.reduce((s, r) => s + (+r.qty || 0), 0);
  const amt = rows.reduce((s, r) => s + (+r.amount || 0), 0);
  const cnt = rows.length;
  const avg = q ? Math.round(amt / q) : null;

  const buyers = buyerList(rows);
  const buyerQty = {};
  buyers.forEach(b => buyerQty[b] = 0);
  rows.forEach(r => { const b = r.buyer || "미지정"; buyerQty[b] = (buyerQty[b] || 0) + (+r.qty || 0); });

  const sum = document.getElementById("p-summary");
  if (sum) {
    let cards = pMetric("총 구매 권수", nf(q) + '<small>권</small>', "#111");
    buyers.forEach(b => { cards += pMetric(b + " 권수", nf(buyerQty[b]) + '<small>권</small>', buyerColor(b)); });
    sum.innerHTML = cards;
  }

  // 카드 아래 텍스트 줄 — 구매 건수 · 총 구매 금액 · 서점별 구매권수(구매자별 분리)
  const storeQty = {}, storeBuyerQty = {};
  rows.forEach(r => {
    const s = r.store || "기타", b = r.buyer || "미지정";
    storeQty[s] = (storeQty[s] || 0) + (+r.qty || 0);
    storeBuyerQty[s] = storeBuyerQty[s] || {};
    storeBuyerQty[s][b] = (storeBuyerQty[s][b] || 0) + (+r.qty || 0);
  });
  const storeOrder = ["예스24", "예스24 선물하기", "카카오톡 선물하기"];
  const stores = [...storeOrder.filter(s => storeQty[s]), ...Object.keys(storeQty).filter(s => !storeOrder.includes(s))];

  const metricsEl = document.getElementById("p-metrics");
  if (metricsEl) {
    const parts = [];
    parts.push(`<span class="metric"><span class="mlbl">구매 건수</span> <b>${nf(cnt)}건</b></span>`);
    parts.push(`<span class="metric"><span class="mlbl">총 구매 금액</span> <b>${nf(amt)}원</b></span>`);
    stores.forEach(s => {
      const bd = buyers.map(b => `${b.charAt(0)} ${nf((storeBuyerQty[s] && storeBuyerQty[s][b]) || 0)}`).join("·");
      parts.push(`<span class="metric"><span class="mlbl">${s}</span> <b>${nf(storeQty[s])}권</b> <span class="mnote">(${bd})</span></span>`);
    });
    metricsEl.innerHTML = parts.join('<span class="msep">·</span>');
  }

  // 순위 유지 가이드 (재설계) — 세부 카테고리(UX/UI·웹·디자인) 방어 + 리뷰 유입 추적
  //  전략: 경제경영 종합은 자가구매로 못 올리는 허영 지표라 목표에서 뺀다.
  //  대신 (1) 타깃 독자가 보는 세부 카테고리 1위를 가벼운 구매로 방어하고,
  //       (2) 진짜 지렛대인 리뷰 유입(주 3개 목표)을 추적한다.
  const P_DAILY_CAP = 4, REVIEW_WK_TARGET = 3;
  const gEl = document.getElementById("p-guide");
  if (gEl) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    let last7 = 0;
    rows.forEach(r => {
      if (!r.date) return;
      const d = new Date(r.date + "T00:00:00");
      const diff = Math.round((today - d) / 864e5);
      if (diff >= 0 && diff <= 6) last7 += (+r.qty || 0);
    });

    // 세부 카테고리 방어 상태 (1위=목표). 값이 있는 것만 본다.
    const subs = [
      { name: "UX/UI", r: LATEST_UXUI },
      { name: "웹", r: LATEST_WEB },
      { name: "디자인", r: LATEST_DESIGN }
    ].filter(s => s.r != null);
    const worst = subs.length ? Math.max(...subs.map(s => s.r)) : null; // 가장 밀린 순위
    const chipColor = v => v <= 1 ? "#0a7f3f" : v <= 3 ? "#b26a00" : "#c0392b";
    const chips = subs.map(s =>
      `<span style="display:inline-block;font-size:11px;font-weight:700;color:${chipColor(s.r)};background:#fff;border:1px solid #e4e4e2;border-radius:6px;padding:2px 8px;margin:2px 4px 0 0;">${s.name} ${nf(s.r)}위</span>`
    ).join("");

    // 일일 방어 목표: 세부 카테고리 순위 유지에 필요한 하루 판매량(대리지표). 캠페인·선물 등 충당 방법은 사용자가 판단.
    let recToday, defStatus, defColor;
    if (worst == null) { recToday = 1; defStatus = "세부 순위 데이터 없음"; defColor = "#888"; }
    else if (worst <= 1) { recToday = 1; defStatus = "세부 1위 방어 중 — 페이스 유지"; defColor = "#0a7f3f"; }
    else if (worst <= 3) { recToday = 2; defStatus = "1~3위 — 1위 회복 위해 약간 상향"; defColor = "#b26a00"; }
    else { recToday = Math.min(P_DAILY_CAP, 3); defStatus = "세부권 이탈 — 상향 필요"; defColor = "#c0392b"; }

    // 마케팅/세일즈 top-50 장기 방어 (목표). 35위를 넘어서면 미리 상향해 50위 여유를 지킨다.
    const mkt = LATEST_MKT, MKT_TARGET = 50, MKT_WARN = 35;
    if (mkt != null) {
      if (mkt > MKT_TARGET) recToday = Math.max(recToday, 3);
      else if (mkt > MKT_WARN) recToday = Math.max(recToday, 2);
    }
    const mktColor = mkt == null ? "#888" : mkt <= 20 ? "#0a7f3f" : mkt <= MKT_TARGET ? "#b26a00" : "#c0392b";
    const mktStatus = mkt == null ? "데이터 없음"
      : mkt <= 20 ? "50위 내 여유"
      : mkt <= MKT_TARGET ? "50위 내 유지 중 (35위 넘으면 상향)"
      : "50위 밖 — 상향 필요";
    // 50위 내 연속 유지 기간 라벨 (일 + 대략 주)
    const _wk = Math.floor(MKT_TOP50_STREAK / 7);
    const mktStreakLabel = MKT_TOP50_STREAK > 0
      ? `50위 내 ${nf(MKT_TOP50_STREAK)}일 연속${_wk >= 1 ? ` · 약 ${_wk}주` : ""}`
      : "50위 밖";

    // 리뷰 유입 속도 (진짜 지렛대). 7일 증가분 vs 주 3개 목표.
    const rv = LATEST_REVIEWS, rvAdd = (rv != null && REVIEWS_7AGO != null) ? (rv - REVIEWS_7AGO) : null;
    let reviewColor, reviewNote;
    if (rvAdd == null) { reviewColor = "#888"; reviewNote = "리뷰 데이터 수집 중"; }
    else if (rvAdd < REVIEW_WK_TARGET) { reviewColor = "#c0392b"; reviewNote = `7일 +${rvAdd} — 정체, 리뷰 요청 필요 (목표 +${REVIEW_WK_TARGET}/주)`; }
    else { reviewColor = "#0a7f3f"; reviewNote = `7일 +${rvAdd} — 양호 (목표 +${REVIEW_WK_TARGET}/주)`; }

    const recNote = recToday <= 1 ? "방어 최소선 · 캠페인/선물로 충당(판단은 직접)" : "세부 1위 회복까지 상향 · 캠페인/선물로 충당";
    const econNote = LATEST_ECON == null ? "경제경영 종합: 순위권 밖(참고용, 목표 아님)" : `경제경영 종합: ${nf(LATEST_ECON)}위(참고용, 목표 아님)`;

    // 50위 이탈 예상 시점 — 마케팅/세일즈 최근 추세(순위/일)로 선형 예측
    let breachVal, breachNote, breachColor;
    {
      const ser = Object.keys(RANK_BY_DATE || {})
        .filter(d => RANK_BY_DATE[d] && RANK_BY_DATE[d].mkt != null)
        .sort()
        .map(d => ({ t: new Date(d + "T00:00:00").getTime() / 864e5, r: RANK_BY_DATE[d].mkt }));
      const rec = ser.slice(-7);
      if (LATEST_MKT == null || LATEST_MKT > 50) {
        breachVal = "이미 이탈"; breachColor = "#c0392b";
        breachNote = LATEST_MKT == null ? "현재 순위권 밖 — 캠페인·선물로 회복 권장" : ("현재 " + nf(LATEST_MKT) + "위 — 50위 밖, 회복 권장");
      } else if (rec.length < 3) {
        breachVal = "관측 부족"; breachColor = "#888";
        breachNote = "예측에 3일 이상 데이터 필요 (수집 중)";
      } else {
        const N = rec.length;
        const mx = rec.reduce((s, p) => s + p.t, 0) / N, my = rec.reduce((s, p) => s + p.r, 0) / N;
        let num = 0, den = 0;
        rec.forEach(p => { num += (p.t - mx) * (p.r - my); den += (p.t - mx) * (p.t - mx); });
        const slope = den ? num / den : 0;
        if (slope <= 0.3) {
          breachVal = "추세 안정"; breachColor = "#0a7f3f";
          breachNote = LATEST_MKT <= 20 ? "여유 있게 50위 내 · 조치 불필요" : "하락 추세 아님 · 조치 불필요";
        } else {
          const daysLeft = Math.max(0, Math.ceil((50 - LATEST_MKT) / slope));
          const when = new Date(); when.setHours(0, 0, 0, 0); when.setDate(when.getDate() + daysLeft);
          const wStr = (when.getMonth() + 1) + "/" + when.getDate();
          breachColor = daysLeft <= 3 ? "#c0392b" : daysLeft <= 7 ? "#b26a00" : "#0a7f3f";
          breachVal = daysLeft > 60 ? "60일+ 여유" : ("약 " + daysLeft + "일 후");
          breachNote = "현재 추세면 " + wStr + "경 50위 밖 예상 · 그 전 캠페인·선물 권장";
        }
      }
    }
    gEl.innerHTML =
      `<div class="pg-row">
        <div class="pg-cell">
          <div class="pg-lbl">세부 카테고리 방어</div>
          <div style="margin:4px 0 2px">${chips || '<span class="pg-note">데이터 없음</span>'}</div>
          <div class="pg-note" style="color:${defColor};font-weight:600">${defStatus}</div>
        </div>
        <div class="pg-cell">
          <div class="pg-lbl">리뷰 (전환 도우미·간접)</div>
          <div class="pg-val" style="color:${reviewColor}">${rv != null ? nf(rv) : "—"}<span>개</span></div>
          <div class="pg-note" style="color:${reviewColor}">${reviewNote}</div>
        </div>
        <div class="pg-cell">
          <div class="pg-lbl">50위 이탈 예상</div>
          <div class="pg-val" style="color:${breachColor}">${breachVal}</div>
          <div class="pg-note" style="color:${breachColor}">${breachNote}</div>
        </div>
      </div>
      <div style="margin:12px 0 2px;padding:9px 12px;border:1px solid #e4e4e2;border-left:3px solid ${mktColor};border-radius:8px;background:#fafafa;font-size:12.5px;">
        <b>마케팅/세일즈</b> <b style="color:${mktColor}">${mkt != null ? nf(mkt) + "위" : "—"}</b>
        <span style="color:#888">· ${mktStatus}</span>
        <span style="display:inline-block;margin-left:6px;font-weight:700;color:#fff;background:${mktColor};border-radius:999px;padding:2px 9px;font-size:11px;">${mktStreakLabel}</span>
        <span style="color:#aaa"> · 목표 50위 장기 유지</span>
      </div>
      <div class="pg-cap">목표를 <b>세부 카테고리(UX/UI·웹·디자인) 1위 방어 + 마케팅/세일즈 50위 + 리뷰 유입</b>으로 잡았습니다. 순위의 직접 동력은 <b>유기 판매 속도(트래픽)</b>이고, 리뷰는 그 트래픽의 <b>구매 전환</b>을 높여 간접 기여합니다(랭킹 공식엔 안 들어감). 최근 7일 알려진 구매 ${nf(last7)}권은 성과 계산 시 차감합니다. <span style="color:#aaa">${econNote}</span></div>`;
  }

  // 구매 → 순위 반응: 구매일별 권수 + 그 전날(D-1) 대비 다음날(D+1) 마케팅/경제경영 순위 변화
  const impEl = document.getElementById("p-impact");
  if (impEl) {
    const byDate = {};
    rows.forEach(r => { if (!r.date) return; byDate[r.date] = (byDate[r.date] || 0) + (+r.qty || 0); });
    const dts = Object.keys(byDate).filter(d => byDate[d] > 0).sort((a, b) => a < b ? 1 : -1);
    const dShift = (s, n) => { const p = s.split("-").map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)).toISOString().slice(0, 10); };
    const rk = (s, key) => { const o = RANK_BY_DATE[s]; return o && o[key] != null ? o[key] : null; };
    const after = (s, key) => { let v = rk(dShift(s, 1), key); if (v == null) v = rk(dShift(s, 2), key); return v; };
    const cell = (before, aft) => {
      if (before == null && aft == null) return `<span style="color:#bbb">—</span>`;
      if (before == null || aft == null) return `${before ?? "—"}→${aft ?? "—"}`;
      const d = before - aft; // 양수면 순위 상승(숫자 작아짐)
      const c = d > 0 ? "#0a7f3f" : d < 0 ? "#c0392b" : "#888";
      const ar = d > 0 ? "▲" : d < 0 ? "▼" : "–";
      return `${before}→${aft} <b style="color:${c}">${ar}${Math.abs(d)}</b>`;
    };
    if (!dts.length) {
      impEl.className = "";
      impEl.innerHTML = `<div class="pempty">구매 기록이 쌓이면 여기서 그날의 순위 반응을 보여줍니다.</div>`;
    } else {
      impEl.className = "tablewrap";
      impEl.innerHTML =
        `<table><thead><tr><th>구매일</th><th>구매</th><th>마케팅/세일즈 (전→후)</th><th>경제경영 (전→후)</th><th>판매지수(후)</th></tr></thead><tbody>` +
        dts.slice(0, 16).map(d => {
          const spike = byDate[d] >= 5;
          const siA = after(d, "si");
          return `<tr${spike ? ' style="background:#fff8e6"' : ''}>
            <td>${d}${spike ? ' <span style="font-size:10px;color:#b26a00;font-weight:700">몰아</span>' : ''}</td>
            <td>${nf(byDate[d])}권</td>
            <td style="text-align:left">${cell(rk(dShift(d, -1), "mkt"), after(d, "mkt"))}</td>
            <td style="text-align:left">${cell(rk(dShift(d, -1), "econ"), after(d, "econ"))}</td>
            <td>${siA != null ? nf(siA) : "—"}</td>
          </tr>`;
        }).join("") +
        `</tbody></table>
        <div class="pg-cap" style="margin-top:8px">전(구매 전날)→후(구매 다음날, 없으면 다다음날) 순위 · <b style="color:#0a7f3f">▲상승</b>·<b style="color:#c0392b">▼하락</b> · 노란 줄=5권 이상 몰아산 날 · 예스24 순위 갱신 지연으로 반응이 하루 밀릴 수 있음</div>`;
    }
  }

  // 사람별 필터(전체/한성희/신행철) — 이 리스트에만 적용, 위 카드·차트·가이드는 전체 기준 유지
  const trows = (P_TABLE_FILTER === "전체") ? rows : rows.filter(r => (r.buyer || "미지정") === P_TABLE_FILTER);
  const tqty = trows.reduce((s, r) => s + (+r.qty || 0), 0);

  const cEl = document.getElementById("p-count");
  if (cEl) cEl.textContent = trows.length
    ? (P_TABLE_FILTER === "전체" ? `(${trows.length}건)` : `(${P_TABLE_FILTER} · ${trows.length}건 · ${nf(tqty)}권)`)
    : "";

  const tw = document.getElementById("p-tablewrap");
  if (tw) {
    if (!trows.length) {
      tw.className = "";
      tw.innerHTML = `<div class="pempty">${P_TABLE_FILTER === "전체" ? "아직 기록이 없습니다. 위에서 직접 입력하거나, 영수증 이미지를 채팅에 올려주세요." : P_TABLE_FILTER + " 님의 기록이 아직 없습니다."}</div>`;
    } else {
      tw.className = "tablewrap";
      tw.innerHTML =
        `<table><thead><tr><th>주문일</th><th>도착일</th><th>서점</th><th>구매자</th><th>수량</th><th>금액</th><th></th></tr></thead><tbody>` +
        trows.map(r => `<tr>
          <td>${r.date || "—"}</td>
          <td>${r.arrival || "—"}</td>
          <td style="text-align:left">${r.store || "—"}</td>
          <td style="text-align:left">${r.buyer || "—"}</td>
          <td>${nf(+r.qty || 0)}권</td>
          <td>${(r.amount != null && r.amount !== "") ? nf(+r.amount) + "원" : "—"}</td>
          <td style="white-space:nowrap"><button class="pedit" data-id="${r.id}">수정</button> <button class="pdel" data-id="${r.id}">삭제</button></td>
        </tr>`).join("") +
        `</tbody></table>`;
      tw.querySelectorAll(".pdel").forEach(b => { b.onclick = () => pDelete(b.dataset.id); });
      tw.querySelectorAll(".pedit").forEach(b => { b.onclick = () => openEditModal(b.dataset.id); });
    }
  }

  const byDayBuyer = {};
  rows.forEach(r => {
    if (!r.date) return;
    const b = r.buyer || "미지정";
    byDayBuyer[r.date] = byDayBuyer[r.date] || {};
    byDayBuyer[r.date][b] = (byDayBuyer[r.date][b] || 0) + (+r.qty || 0);
  });
  const ds = Object.keys(byDayBuyer).sort();
  const cv = document.getElementById("c_purchase");
  if (cv) {
    if (pChart) pChart.destroy();
    const datasets = buyers.map(b => ({
      label: b,
      data: ds.map(d => (byDayBuyer[d] && byDayBuyer[d][b]) || 0),
      backgroundColor: buyerColor(b),
      borderRadius: 4,
      maxBarThickness: 26
    }));
    // 날짜(윗줄) + 구매자별 권수(아랫줄, 예: "한 2 · 신 0")
    const clabels = ds.map(d => {
      const md = d.slice(5);
      const line2 = buyers.map(b => `${b.charAt(0)} ${(byDayBuyer[d] && byDayBuyer[d][b]) || 0}`).join(" · ");
      return [md, line2];
    });
    pChart = new Chart(cv, {
      type: "bar",
      data: { labels: clabels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          y: { beginAtZero: true, ticks: { precision: 0 } },
          x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkip: false, font: { size: 10 } } }
        },
        plugins: { legend: { display: true, position: "bottom", labels: { boxWidth: 10, font: { size: 11 } } } }
      }
    });
  }
}
function mountPurchase() {
  const dateEl = document.getElementById("p-date");
  if (dateEl && !dateEl.value) dateEl.value = new Date().toISOString().slice(0, 10);
  const addBtn = document.getElementById("p-add");
  if (addBtn) addBtn.onclick = () => {
    const date = document.getElementById("p-date").value;
    const arrival = document.getElementById("p-arrival").value || null;
    const store = document.getElementById("p-store").value;
    const buyer = document.getElementById("p-buyer").value.trim() || null;
    const qty = parseInt(document.getElementById("p-qty").value, 10);
    const ar = document.getElementById("p-amount").value;
    const amount = ar ? parseInt(ar, 10) : null;
    if (!date) { alert("주문일을 입력하세요."); return; }
    if (!qty || qty < 1) { alert("수량을 1 이상 입력하세요."); return; }
    if (!confirm("등록할까요?")) return;
    pAddShared({ id: "m" + Date.now(), date, arrival, store, buyer, qty, amount });
    document.getElementById("p-amount").value = "";
    document.getElementById("p-qty").value = "1";
    document.getElementById("p-arrival").value = "";
  };
  // 수정 모달 버튼 배선
  const saveBtn = document.getElementById("pe-save");
  if (saveBtn) saveBtn.onclick = saveEditModal;
  const cancelBtn = document.getElementById("pe-cancel");
  if (cancelBtn) cancelBtn.onclick = closeEditModal;
  const modal = document.getElementById("p-modal");
  if (modal) modal.onclick = (e) => { if (e.target === modal) closeEditModal(); };
  // 사람별 필터 탭(전체/한성희/신행철) — 리스트만 걸러 보여준다
  document.querySelectorAll("#p-filter button").forEach(b => b.onclick = () => {
    document.querySelectorAll("#p-filter button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    P_TABLE_FILTER = b.dataset.bf;
    refreshPurchase();
  });
  refreshPurchase();
}
function pLoadBase() {
  return fetch("./data/purchases.json?t=" + Date.now(), { cache: "no-store" })
    .then(r => r.ok ? r.json() : [])
    .then(d => { PBASE = Array.isArray(d) ? d : []; })
    .catch(() => { PBASE = []; });
}

/* ===================== 구글시트(한성희) 병합 ===================== */
// 성희님이 입력하는 구글시트(마케팅 탭, 웹에 게시된 CSV). 신행철 데이터(purchases.json)와 합쳐 표시.
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT01BzFAcJc1ap1tmT-H_uJ8NwYtJ9X3ulmnlrAxKddKbUijp_JG9Y5CWI7BJMKWsyQAUms7HqpS7zL/pub?output=csv";
const SHEET_BUYER = "한성희";
const SHEET_KNOWN_BUYERS = ["한성희", "신행철"]; // 시트에서 구매자로 인정하는 이름(메모와 구분)
// 대시보드 폼 입력을 구글시트에 바로 저장하는 Apps Script 웹앱 주소.
// (비어 있으면 폼은 이 브라우저에만 저장된다. 배포 후 URL을 여기에 넣는다)
const SHEET_WRITE_URL = "https://script.google.com/macros/s/AKfycbxQKKzl1Pav_YF_TaU5y9KogAB9wpxiho7OzJxM9Slej2bDfCI3lJFhKz6w_ucRf41Y/exec";
function toMD(iso) { const m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? (+m[2]) + "/" + (+m[3]) : (iso || ""); }
const SHEET_STORE_MAP = {
  "카카오톡선물하기": "카카오톡 선물하기", "카카오톡 선물하기": "카카오톡 선물하기",
  "카카오(예스24)": "카카오톡 선물하기",
  "예스24선물하기": "예스24 선물하기", "예스24 선물하기": "예스24 선물하기",
  "예스24": "예스24", "교보": "교보문고", "교보문고": "교보문고", "알라딘": "알라딘"
};
let SHEET_ROWS = [];
function sheetDate(s) { // 여러 형식 허용: "7/8", "2026-07-08", "7/8/2026" → "2026-07-08"
  const t = String(s || "").trim();
  const p = n => String(n).padStart(2, "0");
  let m;
  if ((m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return m[1] + "-" + p(m[2]) + "-" + p(m[3]);        // ISO
  if ((m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))) return m[3] + "-" + p(m[1]) + "-" + p(m[2]);      // M/D/YYYY
  if ((m = t.match(/^(\d{1,2})\/(\d{1,2})$/))) return "2026-" + p(m[1]) + "-" + p(m[2]);                  // M/D
  return null;
}
function parseSheetCSV(text) {
  const out = [];
  let idx = 0;
  for (const line of text.split(/\r?\n/)) {
    const cols = line.split(","); // 데이터 행엔 콤마 없는 값만 들어옴(메모행은 날짜 필터로 제외)
    const date = sheetDate(cols[0]);
    if (!date) continue; // 헤더·합계·메모행 건너뜀
    const qty = parseInt((cols[3] || "").replace(/[^\d]/g, ""), 10);
    if (!qty || qty < 1) continue;
    const raw = (cols[2] || "").trim();
    const store = SHEET_STORE_MAP[raw] || raw || "기타";
    // 구매자: 수량 칸(4번째) 이후의 어느 칸이든 '알려진 이름'이 있으면 그 사람 것으로 인정한다.
    // 메모칸(E열: "와이프 구매", "예스24 선물하기" 등)은 이름이 아니므로 절대 구매자로 잡히지 않는다.
    // 아무 이름도 없으면 한성희로 처리(기존 데이터 호환).
    let buyer = SHEET_BUYER;
    for (let i = 4; i < cols.length; i++) {
      const v = (cols[i] || "").trim();
      if (SHEET_KNOWN_BUYERS.includes(v)) { buyer = v; break; }
    }
    idx++;
    out.push({ id: "sheet_" + date + "_" + idx, date, arrival: sheetDate(cols[1]), store, buyer, qty, amount: qty * 15300 });
  }
  return out;
}
function pLoadSheet() {
  return fetch(SHEET_CSV_URL, { cache: "no-store" })
    .then(r => r.ok ? r.text() : "")
    .then(t => { SHEET_ROWS = t ? parseSheetCSV(t) : []; })
    .catch(() => { SHEET_ROWS = []; });
}

/* ===================== 부팅 ===================== */
Promise.all([pLoadBase(), pLoadSheet()]).finally(() => {
  fetch("./data/history.json?t=" + Date.now())
    .then(r => { if (!r.ok) throw new Error("history.json 로드 실패 (" + r.status + ")"); return r.json(); })
    .then(H => {
      if (!Array.isArray(H) || H.length === 0) throw new Error("수집된 데이터가 없습니다");
      render(H);
    })
    .catch(e => {
      document.getElementById("root").innerHTML =
        `<div class="loading">데이터를 불러오지 못했습니다.<br><small>${e.message}</small></div>`;
    });
});
</script>
